name: Build_zSMTH_APK

on:
  push:
    branches: [ master, 'codex/integration-*' ]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout codes
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Required for the git-based versionCode.

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'

      - name: Assemble Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify APK signatures
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No release APK was generated"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk"
          done

      - name: Upload Release APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: zSMTH-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
